/* =========================================================
   3. 小工具
   ========================================================= */
function $(id){ return document.getElementById(id); }

function esc(str){
  if (str === undefined || str === null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function rowsFor(s, min, max){
  const str = String(s === undefined || s === null ? '' : s);
  const lines = str.split('\n').length;
  const extra = str.length > 40 ? 1 : 0;
  return Math.max(min, Math.min(max, lines + extra));
}

function nextId(){
  return qs.reduce((m, q) => Math.max(m, Number(q.id) || 0), 0) + 1;
}

function toast(msg){
  alert(msg);
}

/* =========================================================
   4. 存取
   ========================================================= */
function loadData(){
  try{
    const raw = localStorage.getItem(DATA_KEY);
    if (raw){
      const arr = JSON.parse(raw);
      if (Array.isArray(arr)) return arr;
    }
  }catch(e){ console.warn('本地数据解析失败，改用内置题库', e); }
  return clone(DB);
}

function saveData(){
  try{
    localStorage.setItem(DATA_KEY, JSON.stringify(qs));
  }catch(e){
    alert('保存失败：浏览器存储可能满了。请先「导出」备份，再删掉一些不用的题。');
  }
  updateStats();
  renderList();
}

/* =========================================================
   5. 初始化
   ========================================================= */
function init(){
  qs = loadData();

  try{
    const th = localStorage.getItem(THEME_KEY);
    if (th && THEMES.some(t => t.id === th)) document.body.dataset.theme = th;

    const t = localStorage.getItem(TITLE_KEY);
    if (t){
      $('site-title').textContent = t;
      document.title = t;
      if ($('nameInput')) $('nameInput').value = t;
    }

    const logo = localStorage.getItem(LOGO_KEY);
    if (logo) $('webLogo').src = logo;

    const deco = localStorage.getItem(DECO_KEY);
    if (deco) applyDeco(deco);
    const fxRaw = localStorage.getItem(FX_KEY);
    if (fxRaw === '0') fxOn = false;
    if (localStorage.getItem(FXF_KEY) === '1') fxFront = true;
    if (localStorage.getItem(FOCUS_KEY) === '1'){
      focusOn = true;
      document.body.classList.add('focus');
    }
    if (localStorage.getItem(NIGHT_KEY) === '1'){
      nightOn = true;
      document.body.classList.add('night');
    }
  }catch(e){}

  syncColorScheme();
  renderThemeGrid();
  applyFx();
  applyProps();
  applyBg();
  syncFxUI();
  syncNightBtn();
  syncFocusBtn();
  refreshFilters();
  updateStats();
  renderList();

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ closeTheme(); closeCrop(); }
  });
}

function syncColorScheme(){
  const dark = DARK_THEMES.includes(document.body.dataset.theme);
  document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
}

/* =========================================================
   6. 名称 / 主题 / 贴纸
   ========================================================= */
function renameTitle(){
  const el = $('site-title');
  if (!el) return;

  const cur = el.textContent;
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'title-edit';
  inp.maxLength = 24;
  inp.value = cur;

  el.parentNode.replaceChild(inp, el);
  inp.focus();
  inp.select();

  let done = false;
  const finish = save => {
    if (done) return;
    done = true;
    const val = inp.value.trim();
    const span = document.createElement('span');
    span.id = 'site-title';
    span.textContent = (save && val) ? val : cur;
    if (inp.parentNode) inp.parentNode.replaceChild(span, inp);
    if (save && val) saveName(val);
  };

  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); finish(true); }
    else if (e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
  inp.addEventListener('blur', () => finish(true));
}

function renameFromInput(v){
  const name = String(v || '').trim();
  if (!name) return;
  saveName(name);
}

function saveName(name){
  const span = $('site-title');
  if (span) span.textContent = name;
  document.title = name;
  const inp = $('nameInput');
  if (inp && inp.value !== name) inp.value = name;
  try{ localStorage.setItem(TITLE_KEY, name); }catch(e){}
}

function openTheme(){
  $('sheetMask').classList.add('open');
  $('themeSheet').classList.add('open');
  $('themeSheet').setAttribute('aria-hidden', 'false');
  if ($('nameInput')) $('nameInput').value = $('site-title').textContent;
}

function closeTheme(){
  $('sheetMask').classList.remove('open');
  $('themeSheet').classList.remove('open');
  $('themeSheet').setAttribute('aria-hidden', 'true');
}

function applyTheme(id){
  if (!THEMES.some(t => t.id === id)) return;
  document.body.dataset.theme = id;
  try{ localStorage.setItem(THEME_KEY, id); }catch(e){}
  syncColorScheme();
  renderThemeGrid();
  applyFx();
  applyProps();
  applyBg();
}

function renderThemeGrid(){
  const grid = $('themeGrid');
  if (!grid) return;
  const cur = document.body.dataset.theme;
  grid.innerHTML = THEMES.map(t => `
    <button type="button" class="theme-card ${t.id === cur ? 'on' : ''}" onclick="applyTheme('${t.id}')">
      <span class="swatches" style="background:${t.mini}"><b>${t.icon || ''}</b></span>
      <b>${esc(t.name)}</b>
      <small>${esc(t.desc)}</small>
    </button>`).join('');
}

function pickDeco(){ $('decoFile').click(); }

function handleDecoFile(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (!/^image\//.test(f.type)){ alert('请选择图片文件～'); return; }
  const fr = new FileReader();
  fr.onload = ev => {
    const url = ev.target.result;
    applyDeco(url);
    try{ localStorage.setItem(DECO_KEY, url); }
    catch(err){ alert('图片太大存不进缓存，本次有效，换个小的就能保存。'); }
  };
  fr.readAsDataURL(f);
}

function applyDeco(url){
  const img = $('decoImg');
  const pv = $('decoPreview');
  if (url){
    if (img){ img.src = url; img.classList.add('show'); }
    if (pv){ pv.src = url; pv.classList.add('show'); }
  } else {
    if (img){ img.removeAttribute('src'); img.classList.remove('show'); }
    if (pv){ pv.removeAttribute('src'); pv.classList.remove('show'); }
  }
}

function clearDeco(){
  applyDeco(null);
  try{ localStorage.removeItem(DECO_KEY); }catch(e){}
}

function toggleNight(){
  nightOn = !nightOn;
  document.body.classList.toggle('night', nightOn);

const artURL = s => "url('data:image/svg+xml;utf8," + encodeURIComponent(s).replace(/'/g, '%27') + "')";

let nebulaBuilt = '';

/* 用 canvas 真正画一张银河：星云团 + 银河带 + 上千颗星 */
function paintNebula(){
  if (nebulaBuilt) return nebulaBuilt;
  const S = 1024;
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  const ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) return '';

  const bg = ctx.createLinearGradient(0, 0, S, S);
  bg.addColorStop(0, '#04030c');
  bg.addColorStop(0.45, '#090615');
  bg.addColorStop(1, '#03040b');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, S, S);

  ctx.save();
  ctx.translate(S / 2, S / 2);
  ctx.rotate(-0.52);

  for (let i = 0; i < 30; i++){
    const x = -720 + Math.random() * 1440;
    const y = (Math.random() - 0.5) * 300;
    const r = 90 + Math.random() * 240;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const pick = Math.random();
    const col = pick < 0.45 ? '120,80,220' : (pick < 0.75 ? '60,140,215' : '215,95,185');
    g.addColorStop(0, 'rgba(' + col + ',' + (0.14 + Math.random() * 0.2).toFixed(2) + ')');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  const core = ctx.createLinearGradient(-760, 0, 760, 0);
  core.addColorStop(0, 'rgba(180,170,255,0)');
  core.addColorStop(0.42, 'rgba(190,180,255,0.18)');
  core.addColorStop(0.5, 'rgba(240,238,255,0.34)');
  core.addColorStop(0.58, 'rgba(190,180,255,0.18)');
  core.addColorStop(1, 'rgba(180,170,255,0)');
  ctx.fillStyle = core;
  ctx.fillRect(-760, -170, 1520, 340);

  for (let i = 0; i < 1100; i++){
    const near = Math.random() < 0.74;
    const x = -780 + Math.random() * 1560;
    const y = (Math.random() - 0.5) * (near ? 300 : 980);
    const r = Math.random() < 0.9 ? Math.random() * 1.25 : 1.3 + Math.random() * 1.7;
    ctx.globalAlpha = 0.22 + Math.random() * 0.78;
    ctx.fillStyle = i % 11 === 0 ? '#ffedcf' : (i % 7 === 0 ? '#cfe4ff' : '#ffffff');
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  nebulaBuilt = cv.toDataURL('image/jpeg', 0.84);
  return nebulaBuilt;
}

}

/* 森林的一天 */
function forestPhase(){
  const h = new Date().getHours();
  if (h >= 20 || h < 5) return 'night';
  if (h >= 17) return 'dusk';
  if (h >= 8) return 'day';
  return 'dawn';
}


/* 画一颗地球：海洋 / 陆地 / 云 / 大气 */
let earthBuilt = '';
function paintEarth(){
  if (earthBuilt) return earthBuilt;
  const S = 560, R = S / 2 - 4, cx = S / 2, cy = S / 2;
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  const ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) return '';

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();

  const og = ctx.createRadialGradient(cx * 0.72, cy * 0.68, R * 0.1, cx, cy, R);
  og.addColorStop(0, '#c8f0ff');
  og.addColorStop(0.35, '#6fbde8');
  og.addColorStop(0.72, '#2a7fb8');
  og.addColorStop(1, '#12496f');
  ctx.fillStyle = og;
  ctx.fillRect(0, 0, S, S);

  /* 陆地：几块聚簇的绿褐色斑块 */
  const clusters = [
    { x: 0.30, y: 0.34, n: 7, s: 0.20 },
    { x: 0.66, y: 0.46, n: 8, s: 0.24 },
    { x: 0.44, y: 0.74, n: 5, s: 0.16 },
    { x: 0.78, y: 0.22, n: 4, s: 0.12 }
  ];
  ctx.filter = 'blur(5px)';
  clusters.forEach(cl => {
    for (let i = 0; i < cl.n; i++){
      const a = Math.random() * Math.PI * 2;
      const d = Math.random() * R * cl.s * 0.6;
      const px = cx + Math.cos(a) * d + (cl.x - 0.5) * S * 0.7;
      const py = cy + Math.sin(a) * d * 0.7 + (cl.y - 0.5) * S * 0.7;
      const rx = R * (0.10 + Math.random() * 0.16);
      const ry = rx * (0.5 + Math.random() * 0.6);
      ctx.beginPath();
      ctx.ellipse(px, py, rx, ry, Math.random() * Math.PI, 0, Math.PI * 2);
      ctx.fillStyle = Math.random() < 0.35 ? 'rgba(176,158,96,.75)' : 'rgba(92,160,86,.8)';
      ctx.fill();
    }
  });

  /* 云：横向拉长的白色絮状 */
  ctx.filter = 'blur(9px)';
  for (let i = 0; i < 26; i++){
    const px = cx + (Math.random() - 0.5) * R * 1.9;
    const py = cy + (Math.random() - 0.5) * R * 1.9;
    ctx.beginPath();
    ctx.ellipse(px, py, R * (0.10 + Math.random() * 0.22), R * (0.03 + Math.random() * 0.07), Math.random() * 0.6 - 0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.18 + Math.random() * 0.4).toFixed(2) + ')';
    ctx.fill();
  }
  ctx.filter = 'none';

  /* 晨昏线 */
  const sh = ctx.createLinearGradient(cx - R, cy - R, cx + R * 1.1, cy + R * 1.1);
  sh.addColorStop(0, 'rgba(0,0,0,0)');
  sh.addColorStop(0.55, 'rgba(2,10,24,.04)');
  sh.addColorStop(0.82, 'rgba(2,10,24,.22)');
  sh.addColorStop(1, 'rgba(2,10,24,.46)');
  ctx.fillStyle = sh;
  ctx.fillRect(0, 0, S, S);

  /* 高光 */
  const hl = ctx.createRadialGradient(cx * 0.66, cy * 0.6, 0, cx * 0.66, cy * 0.6, R * 0.75);
  hl.addColorStop(0, 'rgba(255,255,255,.30)');
  hl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl;
  ctx.fillRect(0, 0, S, S);

  ctx.restore();
  earthBuilt = cv.toDataURL('image/png');
  return earthBuilt;
}

/* =========================================================
   7. 头像：选图 → 圆形裁剪 → 存储
   ========================================================= */
const CROP_SIZE = 520;
let cropImg = null;
let cropZoom = 1;
let cropX = 0;
let cropY = 0;
let cropping = false;
let cropStart = null;

function pickLogo(e){
  if (e && e.stopPropagation) e.stopPropagation();
  $('logoFile').click();
}

function handleLogoFile(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (!/^image\//.test(f.type)){ alert('请选择图片文件～'); return; }

  const fr = new FileReader();
  fr.onload = ev => {
    const im = new Image();
    im.onload = () => {
      cropImg = im;
      cropZoom = 1; cropX = 0; cropY = 0;
      if ($('cropZoom')) $('cropZoom').value = 1;
      $('cropMask').classList.add('open');
      drawCrop();
    };
    im.onerror = () => alert('这张图读不出来，换一张试试～');
    im.src = ev.target.result;
  };
  fr.onerror = () => alert('读取文件失败');
  fr.readAsDataURL(f);
}

function cropMetrics(){
  if (!cropImg) return { w:0, h:0, dx:0, dy:0 };
  const base = Math.max(CROP_SIZE / cropImg.width, CROP_SIZE / cropImg.height);
  const s = base * cropZoom;
  const w = cropImg.width * s;
  const h = cropImg.height * s;
  const dx = (CROP_SIZE - w) / 2 + cropX;
  const dy = (CROP_SIZE - h) / 2 + cropY;
  return { w, h, dx, dy };
}

function clampCrop(){
  const m = cropMetrics();
  const mx = Math.max(0, (m.w - CROP_SIZE) / 2);
  const my = Math.max(0, (m.h - CROP_SIZE) / 2);
  cropX = Math.min(mx, Math.max(-mx, cropX));
  cropY = Math.min(my, Math.max(-my, cropY));
}

function drawCrop(){
  const cv = $('cropCanvas');
  if (!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d');
  if (!ctx) return;

  ctx.clearRect(0, 0, CROP_SIZE, CROP_SIZE);
  ctx.fillStyle = '#dfe6ee';
  ctx.fillRect(0, 0, CROP_SIZE, CROP_SIZE);

  if (!cropImg) return;

  const m = cropMetrics();
  ctx.drawImage(cropImg, m.dx, m.dy, m.w, m.h);

  const R = CROP_SIZE / 2 - 4;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, CROP_SIZE, CROP_SIZE);
  ctx.arc(CROP_SIZE / 2, CROP_SIZE / 2, R, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(10,14,20,.52)';
  ctx.fill('evenodd');
  ctx.restore();

  ctx.beginPath();
  ctx.arc(CROP_SIZE / 2, CROP_SIZE / 2, R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,.92)';
  ctx.lineWidth = 3;
  ctx.setLineDash([12, 10]);
  ctx.stroke();
  ctx.setLineDash([]);

  drawCropPreview();
}

function drawCropPreview(){
  const cv = $('cropPreview');
  if (!cv || !cv.getContext || !cropImg) return;
  const ctx = cv.getContext('2d');
  if (!ctx) return;
  const S = cv.width;
  const m = cropMetrics();
  const k = S / CROP_SIZE;
  ctx.clearRect(0, 0, S, S);
  ctx.save();
  ctx.beginPath();
  ctx.arc(S / 2, S / 2, S / 2, 0, Math.PI * 2);
  ctx.clip();
  ctx.drawImage(cropImg, m.dx * k, m.dy * k, m.w * k, m.h * k);
  ctx.restore();
}

function cropPoint(e){
  const cv = $('cropCanvas');
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (CROP_SIZE / (r.width || CROP_SIZE)),
    y: (e.clientY - r.top) * (CROP_SIZE / (r.height || CROP_SIZE))
  };
}

function cropDown(e){
  if (!cropImg) return;
  e.preventDefault();
  const p = cropPoint(e);
  cropping = true;
  cropStart = { sx: p.x, sy: p.y, ox: cropX, oy: cropY };
  try{ e.target.setPointerCapture(e.pointerId); }catch(err){}
}

function cropMove(e){
  if (!cropping || !cropStart) return;
  e.preventDefault();
  const p = cropPoint(e);
  cropX = cropStart.ox + (p.x - cropStart.sx);
  cropY = cropStart.oy + (p.y - cropStart.sy);
  clampCrop();
  drawCrop();
}

function cropUp(){ cropping = false; cropStart = null; }

function cropWheel(e){
  if (!cropImg) return;
  e.preventDefault();
  cropZoom = Math.min(3, Math.max(1, cropZoom + (e.deltaY > 0 ? -0.06 : 0.06)));
  if ($('cropZoom')) $('cropZoom').value = cropZoom;
  clampCrop();
  drawCrop();
}

function setCropZoom(v){
  cropZoom = Number(v) || 1;
  clampCrop();
  drawCrop();
}

function closeCrop(){
  $('cropMask').classList.remove('open');
}

function confirmCrop(){
  if (!cropImg){ closeCrop(); return; }
  const OUT = 360;
  const m = cropMetrics();
  const k = OUT / CROP_SIZE;

  const out = document.createElement('canvas');
  out.width = OUT; out.height = OUT;
  const ctx = out.getContext('2d');
  ctx.save();
  ctx.beginPath();
  ctx.arc(OUT / 2, OUT / 2, OUT / 2, 0, Math.PI * 2);
  ctx.clip();
  ctx.drawImage(cropImg, m.dx * k, m.dy * k, m.w * k, m.h * k);
  ctx.restore();

  let url = out.toDataURL('image/png');

  if (url.length > 900000){
    const out2 = document.createElement('canvas');
    out2.width = OUT; out2.height = OUT;
    const c2 = out2.getContext('2d');
    c2.fillStyle = '#ffffff';
    c2.fillRect(0, 0, OUT, OUT);
    c2.save();
    c2.beginPath();
    c2.arc(OUT / 2, OUT / 2, OUT / 2, 0, Math.PI * 2);
    c2.clip();
    c2.drawImage(cropImg, m.dx * k, m.dy * k, m.w * k, m.h * k);
    c2.restore();
    url = out2.toDataURL('image/jpeg', 0.9);
  }

  applyLogo(url);
  closeCrop();
}

/* 六向雪花晶体 */
function snowflakeSVG(variant){
  const cx = 50, cy = 50;
  const parts = [];

  /* 六边形核心 */
  const hex = [];
  for (let i = 0; i < 6; i++){
    const a = Math.PI / 3 * i - Math.PI / 2;
    hex.push((cx + 9 * Math.cos(a)).toFixed(1) + ' ' + (cy + 9 * Math.sin(a)).toFixed(1));
  }
  parts.push("<polygon points='" + hex.join(' ') + "'/>");

  /* 六条主枝 + 侧枝 + 尖端 */
  for (let i = 0; i < 6; i++){
    const a = Math.PI / 3 * i + (variant ? Math.PI / 6 : 0);
    const ux = Math.cos(a), uy = Math.sin(a);
    const at = r => [cx + ux * r, cy + uy * r];

    const p0 = at(9), p1 = at(45);
    parts.push("<path d='M" + p0[0].toFixed(1) + " " + p0[1].toFixed(1) + "L" + p1[0].toFixed(1) + " " + p1[1].toFixed(1) + "'/>");

    const branches = variant ? [[20, 10], [31, 7]] : [[22, 11], [33, 7]];
    branches.forEach(pair => {
      const r = pair[0], len = pair[1];
      const b = at(r);
      [1, -1].forEach(side => {
        const ba = a + side * Math.PI / 3;
        const ex = b[0] + Math.cos(ba) * len;
        const ey = b[1] + Math.sin(ba) * len;
        parts.push("<path d='M" + b[0].toFixed(1) + " " + b[1].toFixed(1) + "L" + ex.toFixed(1) + " " + ey.toFixed(1) + "'/>");
      });
    });

    /* 枝头小六边形 */
    const t = at(45);
    const tip = [];
    for (let k = 0; k < 6; k++){
      const ta = Math.PI / 3 * k - Math.PI / 2;
      tip.push((t[0] + 3.4 * Math.cos(ta)).toFixed(1) + ' ' + (t[1] + 3.4 * Math.sin(ta)).toFixed(1));
    }
    parts.push("<polygon points='" + tip.join(' ') + "'/>");
  }

  return "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>" +
    "<g fill='none' stroke='#82c9ec' stroke-width='4.4' stroke-linecap='round' stroke-linejoin='round' opacity='.95'>" +
    parts.join('') + "</g>" +
    "<circle cx='50' cy='50' r='3' fill='#ffffff'/></svg>";
}
const SNOW_A = artURL(snowflakeSVG(0));
const SNOW_B = artURL(snowflakeSVG(1));

function applyFx(){
  const box = $('particles');
  if (!box) return;

  const t = THEMES.find(x => x.id === document.body.dataset.theme) || THEMES[0];
  document.body.classList.toggle('fx-front', !!fxFront);

  box.className = 'fx-particles';
  box.innerHTML = '';

  if (t.id === 'forest') document.body.dataset.phase = forestPhase();
  else delete document.body.dataset.phase;

  let fx = t.fx;
  if (t.id === 'forest'){
    const ph = document.body.dataset.phase;
    fx = (ph === 'night' || ph === 'dusk') ? 'firefly' : 'leaf';
  }

  if (!fxOn || focusOn || !fx) return;
  box.className = 'fx-particles fx-' + fx;

  if (fx === 'snow') document.body.style.setProperty('--snowflake', SNOW_A);

  const isStar = t.fx === 'star';
  const isBubble = t.fx === 'bubble';
  const isDust = t.fx === 'dust';
  const isSnow = t.fx === 'snow';
  const n = isStar ? 32 : (isSnow ? 12 : (isBubble || isDust ? 9 : 10));

  for (let i = 0; i < n; i++){
    const s = document.createElement('span');
    const size = isStar ? (1.4 + Math.random() * 1.8)
               : isSnow ? (22 + Math.random() * 18)
               : (isDust ? (2 + Math.random() * 3) : (5 + Math.random() * 7));

    s.style.left = (Math.random() * 100).toFixed(1) + '%';
    s.style.width = size.toFixed(1) + 'px';
    s.style.height = size.toFixed(1) + 'px';
    if (isSnow) s.style.backgroundImage = Math.random() < 0.5 ? SNOW_A : SNOW_B;

    if (isStar){
      s.style.top = (Math.random() * 100).toFixed(1) + '%';
      s.style.animationDuration = (3 + Math.random() * 4).toFixed(1) + 's';
      s.style.animationDelay = (-Math.random() * 6).toFixed(1) + 's';
      s.style.color = 'var(--particle)';
    } else if (isBubble || isDust){
      const d = 10 + Math.random() * 14;
      s.style.animationDuration = d.toFixed(1) + 's';
      s.style.animationDelay = (-Math.random() * d).toFixed(1) + 's';
      s.style.opacity = fxFront ? '0.30' : '0.50';
    } else {
      s.style.animationDuration = (8 + Math.random() * 8).toFixed(1) + 's';
      s.style.animationDelay = (-Math.random() * 15).toFixed(1) + 's';
      s.style.opacity = fxFront
        ? (0.35 + Math.random() * 0.30).toFixed(2)
        : (0.55 + Math.random() * 0.35).toFixed(2);
    }
    box.appendChild(s);
  }
}

function updateStats(){

  const mastered = qs.filter(q => q.m).length;
  const choice = qs.filter(q => q.type === '选择题').length;
  $('s-total').textContent = total;
  $('s-wrong').textContent = total - mastered;
  $('s-mastered').textContent = mastered;
  $('s-rate').textContent = total ? Math.round(mastered / total * 100) + '%' : '0%';
  $('s-type').textContent = choice + ' / ' + (total - choice);
}

function refreshFilters(){
  const ts = $('f-type');
  const ss = $('f-sub');
  if (!ts || !ss) return;

  const keepT = ts.value || 'all';
  const keepS = ss.value || 'all';
  const types = [...new Set(qs.map(q => q.type).filter(Boolean))];
  const subs = [...new Set(qs.map(q => q.sub).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh'));

  ts.innerHTML = '<option value="all">全部类型</option>' +
    types.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  ss.innerHTML = '<option value="all">全部考点</option>' +
    subs.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');

  ts.value = types.includes(keepT) ? keepT : 'all';
  ss.value = subs.includes(keepS) ? keepS : 'all';

  const dl = $('subList');
  if (dl) dl.innerHTML = subs.map(s => `<option value="${esc(s)}">`).join('');
}

function getFiltered(){
  const kw = ($('f-search').value || '').trim().toLowerCase();
  const type = $('f-type').value;
  const sub = $('f-sub').value;
  const state = $('f-state').value;

  return qs.filter(q => {
    if (type !== 'all' && q.type !== type) return false;
    if (sub !== 'all' && q.sub !== sub) return false;
    if (state === 'wrong' && q.m) return false;
    if (state === 'mastered' && !q.m) return false;
    if (kw){
      const hay = [q.q, q.o, q.a, q.e, q.sub].join(' ').toLowerCase();
      if (hay.indexOf(kw) === -1) return false;
    }
    return true;
  });
}

function renderList(){
  refreshFilters();
  const list = $('list');

  const arr = getFiltered();
  const cnt = $('list-count');
  if (cnt) cnt.textContent = `显示 ${arr.length} / 共 ${qs.length} 题`;

  if (!arr.length){
    list.innerHTML = '<div class="empty-state">🐶 没有符合条件的题目，换个筛选条件试试</div>';
    return;

  list.innerHTML = arr.map(q => (editingId === Number(q.id) ? editHTML(q) : cardHTML(q))).join('');

function delQuestion(id){

function copyText(text, okMsg){
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    alert(ok ? okMsg : '复制失败，请手动选中文字复制～');
  };

  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(() => alert(okMsg)).catch(fallback);
  } else {
    fallback();
  }
}

/* 解析粘贴文本 → { title, options, ans, exp } */
function parsePasted(raw){
  let text = String(raw || '').replace(/\r\n?/g, '\n').replace(/\u3000/g, ' ');
  text = text.replace(/[\uFF21-\uFF24]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
  text = text.trim().replace(/^(?:第\s*)?\d+\s*(?:题)?\s*[\.、\)．:：]\s*/, '');

  let exp = '';
  let m = text.match(/(?:【\s*(?:解析|分析|详解|考点|答案解析)\s*】|(?:解析|分析|详解)\s*[:：])\s*([\s\S]*)$/);
  if (m){ exp = m[1].trim(); text = text.slice(0, m.index); }

  let ans = '';
  m = text.match(/(?:【\s*(?:正确|参考)?答案\s*】|(?:正确|参考)?答案\s*(?:是|为)?\s*[:：]?)\s*([A-Da-d])(?![A-Za-z0-9])/);
  if (m){
    ans = m[1].toUpperCase();
    text = text.slice(0, m.index) + ' ' + text.slice(m.index + m[0].length);
  } else {
    const m2 = text.match(/(?:【?\s*(?:正确|参考)?答案\s*】?\s*[:：]?)\s*([\s\S]+)$/);
    if (m2){
      const tail = m2[1].trim();
      if (tail && tail.length <= 40) ans = tail;
      text = text.slice(0, m2.index);
    }
  }

  const markRe = /(^|[\s\n？?。．、，,;；:：！!（(【\[》」』])([A-D])\s*[\.、．\)）:：]\s*/g;
  const marks = [];
  let mm;
  while ((mm = markRe.exec(text)) !== null){
    /* 括号既是选项的一部分，所以题干要切在括号前；句末问号之类属于题干，保留 */
    const bracket = /[（(【\[》」』]/.test(mm[1]);
    marks.push({
      letter: mm[2],
      titleEnd: bracket ? mm.index : mm.index + mm[1].length,
      cut: mm.index,
      end: markRe.lastIndex
    });
  }

  let seq = [];
  if (marks.length >= 2){
    let st = marks.findIndex(x => x.letter === 'A');
    if (st === -1) st = 0;
    seq = [marks[st]];
    for (let i = st + 1; i < marks.length; i++){
      const want = String.fromCharCode(65 + seq.length);
      if (marks[i].letter === want) seq.push(marks[i]);
      else if (seq.length >= 2 && marks[i].letter === 'A') break;
    }
  }

  let title = text.trim();
  const options = [];

  if (seq.length >= 2){
    title = text.slice(0, seq[0].titleEnd);
    seq.forEach((mk, i) => {
      const stop = i + 1 < seq.length ? seq[i + 1].cut : text.length;
      let body = text.slice(mk.end, stop).replace(/\n+/g, ' ').replace(/\s{2,}/g, ' ').trim();
      body = body.replace(/^[:：]\s*/, '');
      options.push(mk.letter + '. ' + body);
    });
  }

  title = title.replace(/^\s*[:：]\s*/, '').replace(/\n{3,}/g, '\n\n').trim();
  if (!title) title = text.trim();

  return { title, options, ans, exp };
}

function smartParse(){
  const raw = $('smart-paste').value;
  if (!raw.trim()){ alert('先把题目粘进来～'); return; }

  const r = parsePasted(raw);

  $('q-title').value = r.title;
  $('q-opt').value = r.options.join('\n');
  $('q-ans').value = r.ans;
  $('q-exp').value = r.exp;
  if (r.options.length) $('q-type').value = '选择题';

  showParsePreview(r);
}

function showParsePreview(r){
  const box = $('parsePreview');
  if (!box) return;

  const bits = [`题干 ${r.title.length} 字`, `选项 ${r.options.length} 个`];
  bits.push(r.ans ? `答案 ${r.ans}` : '答案 未识别');
  if (r.exp) bits.push(`解析 ${r.exp.length} 字`);

  let html = `<div class="sum">✅ 拆出：${esc(bits.join(' · '))}</div>`;

  if (r.options.length){
    html += '<ol>' + r.options.map(o => `<li>${esc(o)}</li>`).join('') + '</ol>';
  } else {
    html += '<div class="parse-warn">⚠️ 没识别到选项。如果这是选择题，检查选项前是否有「A.」「A、」「（A）」这类标记。</div>';
  }
  if (!r.ans){
    html += '<div class="parse-warn" style="margin-top:6px;">⚠️ 没找到「答案：X」，请在下面手动填一下。</div>';
  }
  if (r.title.length < 6){
    html += '<div class="parse-warn" style="margin-top:6px;">⚠️ 题干看起来太短，可能被切多了，检查一下。</div>';
  }

  box.innerHTML = html;
  box.classList.add('show');
}

function addQuestion(){
  const type = $('q-type').value;
  const sub = $('q-sub').value.trim();
  const title = $('q-title').value.trim();
  const opt = $('q-opt').value.trim();
  const ans = $('q-ans').value.trim();
  const exp = $('q-exp').value.trim();

  if (!title){ alert('题干不能为空哦～'); return; }
  if (!ans){ alert('还没填答案呢～'); return; }

  qs.push({
    id: nextId(),
    type: type,
    sub: sub || '未分类',
    q: title,
    o: opt,
    a: ans,
    e: exp,
    m: false
  });

  clearForm();
  $('q-sub').value = '';
  saveData();
  toggleForm();
  toast('✅ 已保存，新题在列表最下面');
}

/* =========================================================
   10. 考试模式
   ========================================================= */
let examQs = [];
let examPick = {};

function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function optList(o){
  return String(o || '').split('\n').map(s => s.trim()).filter(Boolean);
}

function optLetter(text, index){
  const m = String(text).match(/^([A-Da-d])\s*[\.、．\)）]/);
  return m ? m[1].toUpperCase() : String.fromCharCode(65 + index);
}

function startExam(){
  const pool = qs.filter(q => q.type === '选择题');
  if (!pool.length){ alert('题库里还没有选择题哦～'); return; }

  const unmastered = pool.filter(q => !q.m);
  const base = unmastered.length >= 3 ? unmastered : pool;

  examQs = shuffle(base.slice()).slice(0, Math.min(10, base.length));
  examPick = {};

  $('mainArea').style.display = 'none';
  $('addForm').classList.remove('open');
  $('examArea').style.display = 'block';
  $('exam-list').style.display = 'block';
  $('exam-result').style.display = 'none';

  renderExam();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderExam(){
  $('exam-list').innerHTML = examQs.map((q, i) => {
    const opts = optList(q.o);
    return `
      <div class="exam-item" id="exam-item-${i}">
        <div class="q-meta">
          <span class="q-tag typing">第 ${i + 1} 题</span>
          <span class="q-tag">${esc(q.sub || '未分类')}</span>
        </div>
        <div class="q-title">${esc(q.q)}</div>
        <div>${opts.map((o, j) => {
          const L = optLetter(o, j);
          return `<button class="opt-btn" onclick="pickOption(${i}, '${L}', this)">${esc(o)}</button>`;
        }).join('')}</div>
      </div>`;
  }).join('');
  updateExamProgress();
}

function pickOption(i, letter, btn){
  examPick[i] = letter;
  const item = $('exam-item-' + i);
  if (item && item.querySelectorAll){
    const all = item.querySelectorAll('.opt-btn');
    for (let k = 0; k < all.length; k++) all[k].classList.remove('selected');
  }
  if (btn && btn.classList) btn.classList.add('selected');
  updateExamProgress();
}

function updateExamProgress(){
  const done = Object.keys(examPick).length;
  $('exam-progress').textContent = `已答 ${done} / ${examQs.length}`;
}

function submitExam(){
  if (!examQs.length) return;

  const answered = Object.keys(examPick).length;
  if (answered < examQs.length && !confirm(`还有 ${examQs.length - answered} 题没做，确定交卷吗？`)) return;

  let right = 0;
  const wrongList = [];

  examQs.forEach((q, i) => {
    const correct = String(q.a || '').trim().toUpperCase().charAt(0);
    const mine = examPick[i] || '';
    if (mine === correct){
      right++;
      q.m = true;
    } else {
      q.m = false;
      wrongList.push({ q, mine, correct });
    }
  });

  saveData();

  $('score-text').textContent = Math.round(right / examQs.length * 100) + ' 分';
  $('score-sub').textContent = `答对 ${right} 题 / 共 ${examQs.length} 题`;

  const review = $('wrong-review');
  if (!wrongList.length){
    review.innerHTML = '<div class="item" style="text-align:center;">🎉 全对！这些题都标记成「已掌握」了。</div>';
  } else {
    review.innerHTML = '<div class="item" style="background:transparent;border:none;padding:0;">📌 错题回顾</div>' +
      wrongList.map(w => `
        <div class="item">
          <div class="qq">${esc(w.q.q)}</div>
          <div class="aa">你的答案：<b>${esc(w.mine || '未作答')}</b>　正确答案：<em>${esc(w.correct)}</em></div>
          ${w.q.e ? `<div class="aa" style="margin-top:6px;">${esc(w.q.e)}</div>` : ''}
        </div>`).join('');
  }

  $('exam-list').style.display = 'none';
  $('exam-result').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function exitExam(){
  $('examArea').style.display = 'none';
  $('mainArea').style.display = 'block';
  examQs = [];
  examPick = {};
  updateStats();
  renderList();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================
   11. 备份 / 重置
   ========================================================= */
function exportData(){
  const stamp = new Date().toISOString().slice(0, 10);
  const blob = new Blob([JSON.stringify(qs, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `C++错题本备份_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importData(){ $('importFile').click(); }

function handleImport(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const arr = JSON.parse(ev.target.result);
      if (!Array.isArray(arr) || !arr.length) throw new Error('文件里没有题目');
      if (!arr.every(x => x && typeof x.q === 'string')) throw new Error('缺少题目标题字段');
      if (!confirm(`要导入 ${arr.length} 道题吗？当前题库（${qs.length} 题）会被覆盖。`)) return;

      qs = arr.map((x, i) => ({
        id: Number(x.id) || (i + 1),
        type: x.type || '选择题',
        sub: x.sub || '未分类',
        q: x.q,
        o: x.o || '',
        a: x.a || '',
        e: x.e || '',
        m: !!x.m
      }));

      saveData();
      alert('✅ 导入成功！');
    }catch(err){
      alert('导入失败：这不是有效的错题本备份文件。\n' + err.message);
    }
  };
  reader.readAsText(file, 'utf-8');
}

function resetData(){
  if (!confirm('🔄 会把题库恢复成内置的 72 道题（你自己加的会丢失），用于修复排版错乱或同步最新题库。\n\n确定重置吗？')) return;
  try{ localStorage.removeItem(DATA_KEY); }catch(e){}
  qs = clone(DB);
  editingId = null;
  saveData();
  alert('✅ 重置成功，题库已恢复为 72 题。');
}

/* =========================================================
   12. 启动
   ========================================================= */
init();
